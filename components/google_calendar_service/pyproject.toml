[project]
name = "google-calendar-service"
version = "0.1.0"
description = "FastAPI service for Google Calendar client"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "calendar-client-api",
    "google-calendar-client-impl",
    "ai-client-api",
    "openai-ai-client-impl",
    "issue-tracker-api",
    "issue-tracker-client-impl",
    "fastapi>=0.135.1",
    "fastapi-sessions>=0.3.2",
    "httpx>=0.28.1",
    "uvicorn>=0.42.0",
    "python-dotenv>=1.0.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "opentelemetry-exporter-otlp-proto-http>=1.23.0",
]

[tool.uv.sources]
ai-client-api = { workspace = true }
calendar-client-api = { workspace = true }
google-calendar-client-impl = { workspace = true }
openai-ai-client-impl = { workspace = true }
issue-tracker-api = { workspace = true }
issue-tracker-client-impl = { git = "https://github.com/yawnka/ospsd-team-03.git", subdirectory = "components/issue_tracker_client_impl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_calendar_service"]

[tool.hatch.build.targets.wheel.force-include]
"src/google_calendar_service/py.typed" = "google_calendar_service/py.typed"
