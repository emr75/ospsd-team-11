[project]
name = "google-calendar-client-impl"
version = "0.1.0"
description = "Implementation of the calendar client interface using Google Calendar API, supporting event lifecycle operations and integration within a modular, dependency-injected service architecture."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "calendar-client-api",
    "ospsd-calendar-api",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.177.0",
    "google-auth>=2.40.3",
    "google-auth-oauthlib>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_calendar_client_impl"]

[tool.hatch.build.targets.wheel.force-include]
"src/google_calendar_client_impl/py.typed" = "google_calendar_client_impl/py.typed"
