[project]
name = "ai-client-api"
version = "0.1.0"
description = "Abstract AI client interface for HW3"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/ai_client_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai_client_api/py.typed" = "ai_client_api/py.typed"
